<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- LaunchRadar: the radar mark (rings, a sweeping beam, a blip) on the app's dark background.
       Everything sits inside the inner 80% so the icon survives the masks launchers apply. -->
  <defs>
    <linearGradient id="beam" x1="256" y1="256" x2="256" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#09090b"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="#3f3f46" stroke-width="12"/>
  <circle cx="256" cy="256" r="117" fill="none" stroke="#3f3f46" stroke-width="12"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="#52525b" stroke-width="12"/>
  <path d="M256 256 L256 68 A188 188 0 0 1 389 123 Z" fill="url(#beam)" opacity="0.6"/>
  <path d="M256 256 L256 68" stroke="#a5b4fc" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="21" fill="#e0e7ff"/>
  <circle cx="372" cy="148" r="22" fill="#34d399"/>
</svg>
