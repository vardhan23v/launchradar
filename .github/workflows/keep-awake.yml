# Pings the free Render API so it does not fall asleep after 15 idle minutes.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 --retry 2 https://launchradar-api.onrender.com/api/health
